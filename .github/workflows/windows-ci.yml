name: Forge Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q main.py forge tests

      - name: Run Forge audit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q

      - name: Validate registered agents
        shell: pwsh
        run: |
          @'
          from forge import list_registered_agents, load_registered_agent
          agents = list_registered_agents()
          slugs = {item.get('slug') for item in agents if 'slug' in item}
          if 'fewura-crm-agent' not in slugs:
              raise SystemExit(f'FEWURA CRM Agent not registered: {agents}')
          blueprint = load_registered_agent('fewura-crm-agent')
          if blueprint.name != 'FEWURA CRM Agent' or blueprint.autonomy_level != 2:
              raise SystemExit('FEWURA CRM Agent blueprint invalid')
          print('FEWURA CRM Agent registration OK')
          '@ | Set-Content test_catalog.py -Encoding UTF8
          python test_catalog.py

      - name: Test Windows release file generation
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from forge.windows_release import write_windows_release_files

          required = {
              'requirements-release.txt',
              'installer.iss',
              'build_release.ps1',
              'build_release.bat',
              'RELEASE_WINDOWS.md',
          }

          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              write_windows_release_files(root, 'Forge Test Agent', 'forge-test-agent', '1.0.0')
              missing = sorted(name for name in required if not (root / name).exists())
              if missing:
                  raise SystemExit(f'Missing generated release files: {missing}')

              ps1 = (root / 'build_release.ps1').read_text(encoding='utf-8')
              for marker in ['code-audit.json', 'PyInstaller', 'Get-AuthenticodeSignature', 'installer.iss', '--self-test', 'release-manifest.json']:
                  if marker not in ps1:
                      raise SystemExit(f'Missing release gate marker: {marker}')
          print('Windows release generation test OK')
          '@ | Set-Content test_release_generation.py -Encoding UTF8
          python test_release_generation.py

